name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies for PyQt6 (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1 \
          libegl1 \
          libxkbcommon0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libdbus-1-3

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Test imports
      run: |
        python -c "from ai_training_monitor.core.monitor import TrainingMonitor; print('Core import OK')"
        python -c "from ai_training_monitor.parsers.ostris import OstrisParser; print('Parser import OK')"
        python -c "from ai_training_monitor.version import __version__; print(f'Version: {__version__}')"

    - name: Test CLI
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m ai_training_monitor --version
        python -m ai_training_monitor --help

    - name: Run tests
      run: |
        # Run proper test files if they exist, excluding one-offs
        if [ -d "tests" ]; then
          # Check if there are actual test files (not in one-offs)
          if find tests -name "test_*.py" -not -path "*/one-offs/*" | grep -q .; then
            python -m pytest tests/ -v --ignore=tests/one-offs
          else
            echo "No formal test files found (one-offs excluded)"
          fi
        else
          echo "No tests directory found"
        fi
      shell: bash
      continue-on-error: true

    - name: Test core functionality (non-GUI)
      run: |
        # Test basic imports and functionality without GUI
        python -c "
import sys
print('Testing core imports...')

# Test version system
from ai_training_monitor.version import __version__, get_version_dict
version_info = get_version_dict()
print(f'Version: {version_info[\"full\"]}')
assert version_info['base'].startswith('0.1.')

# Test parser imports
from ai_training_monitor.parsers.base import BaseParser
from ai_training_monitor.parsers.ostris import OstrisParser
print('Parser imports OK')

# Test data structures
from ai_training_monitor.core.data_manager import MetricsBuffer
buffer = MetricsBuffer(maxlen=100)
buffer.add_metrics({'loss': 0.5, 'lr': 1e-4})
assert len(buffer.get_all_metrics()) == 1
print('Data manager OK')

# Test analyzer
from ai_training_monitor.core.analyzer import PatternAnalyzer
analyzer = PatternAnalyzer()
print('Analyzer OK')

print('All core functionality tests passed!')
"
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        pip install twine
        twine check dist/*
      continue-on-error: true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/